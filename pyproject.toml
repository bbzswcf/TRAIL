[project]

name = "TRAIL"
version = "0.1.0"

dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-c==0.24.1",
    "tree-sitter-rust==0.24.0",
    "openai>=1.65.4",
    "pebble>=5.1.0",
    "httpx>=0.28.1",
    "tqdm>=4.67.1",
    "requests==2.32.3",
    "google-genai>=2.7.0",
]
requires-python = ">=3.10"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=76.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["c2rust_translator"]

[tool.pdm]
